name = "relab"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

# Base de datos de Relab: una sola cuenta para todos los recursos.
# Creada desde el panel de Cloudflare (D1 → relab).
[[d1_databases]]
binding = "DB"
database_name = "relab"
database_id = "27104637-1cf1-4bc0-a786-c845c359ea48"

# GOOGLE_CLIENT_ID es público (viaja en cada login), por eso va acá.
# GOOGLE_CLIENT_SECRET y TEXT_KEY van SOLO en el panel de Cloudflare, como Secretos (ver DEPLOY.md).
# TEXT_KEY cifra los textos de los usuarios: si se pierde, lo guardado queda ilegible.
# ALLOWED_EMAILS (opcional): lista separada por comas de emails o dominios (@empresa.com)
# que pueden crear cuenta. Vacío = cualquier cuenta de Google.
[vars]
GOOGLE_CLIENT_ID = "1010724195443-aq6kr91kklqmr7bt0dn2lg3kmpm5mo3i.apps.googleusercontent.com"
ALLOWED_EMAILS = ""
